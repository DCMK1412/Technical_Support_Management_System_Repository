<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMS - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold tracking-wider text-blue-500">TSMS</span>
            <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded border border-blue-500/30 font-mono">v1.0</span>
        </div>
        <div class="flex items-center space-x-4" id="navLinks">
            <a href="/tickets/tickets-ui/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Tickets</a>
            <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded transition font-medium cursor-pointer">Sign Out</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8 flex justify-between items-end">
            <div>
                <h2 class="text-2xl font-bold text-white" id="welcomeMessage">Dashboard</h2>
                <p class="text-sm text-gray-400 mt-1" id="roleSubtitle">Loading your statistics...</p>
            </div>
        </div>

        <div id="metricsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            </div>
    </main>

<script>
        const token = localStorage.getItem('user_token');
        const role = localStorage.getItem('user_role');

        if (!token) {
            window.location.href = '/tickets/login-ui/';
        }

        if (role === 'ADMIN') {
            const navLinks = document.getElementById('navLinks');
            navLinks.insertAdjacentHTML('afterbegin', `
                <a href="/tickets/users-ui/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Users</a>
                <a href="/tickets/categories-ui/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Categories</a>
            `);
        }

        async function fetchDashboardData() {
            try {
                const response = await fetch('http://127.0.0.1:8000/tickets/api-dashboard/', {
                    headers: { 'Authorization': 'Token ' + token }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderMetrics(data.metrics, data.role);
                } else {
                    if (response.status === 401) logout();
                }
            } catch (error) {
                console.error('Error fetching dashboard:', error);
            }
         }

            function renderMetrics(metrics, userRole) {
                document.getElementById('welcomeMessage').innerText = `Welcome back`;
                document.getElementById('roleSubtitle').innerText = `Overview for ${userRole} account`;

                const grid = document.getElementById('metricsGrid');
                let cardsHTML = '';

                const createCard = (title, value, color) => `
                    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 shadow-sm border-l-4 border-l-${color}-500">
                        <div class="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2">${title}</div>
                        <div class="text-3xl font-extrabold text-white">${value || 0}</div>
                    </div>
                `;

                if (userRole === 'ADMIN') {
                    cardsHTML += createCard('Total Tickets', metrics.total, 'blue');
                    cardsHTML += createCard('Open Tickets', metrics.open, 'yellow');
                    cardsHTML += createCard('In Progress', metrics.in_progress, 'purple');
                    cardsHTML += createCard('Pending', metrics.pending, 'orange'); // كرت جديد
                    cardsHTML += createCard('Resolved', metrics.resolved, 'green'); // كرت جديد
                    cardsHTML += createCard('Closed', metrics.closed, 'teal');
                    cardsHTML += createCard('Total Users', metrics.users_count, 'gray');
                    cardsHTML += createCard('Support Staff', metrics.support_count, 'red');
                } else if (userRole === 'SUPPORT') {
                    cardsHTML += createCard('Assigned To Me', metrics.assigned_to_me, 'blue');
                    cardsHTML += createCard('Open Tickets', metrics.open, 'yellow');
                    cardsHTML += createCard('In Progress', metrics.in_progress, 'purple');
                    cardsHTML += createCard('Pending', metrics.pending, 'orange'); // كرت جديد
                    cardsHTML += createCard('Resolved', metrics.resolved, 'green'); // كرت جديد
                    cardsHTML += createCard('Closed', metrics.closed, 'teal');
                } else {
                    cardsHTML += createCard('My Open Tickets', metrics.open, 'yellow');
                    cardsHTML += createCard('In Progress', metrics.in_progress, 'purple');
                    cardsHTML += createCard('Pending', metrics.pending, 'orange'); // كرت جديد
                    cardsHTML += createCard('Resolved', metrics.resolved, 'green'); // كرت جديد
                    cardsHTML += createCard('Closed', metrics.closed, 'teal');
                }

                grid.innerHTML = cardsHTML;
            }

        function logout() {
            localStorage.clear();
            window.location.href = '/tickets/login-ui/';
        }

        fetchDashboardData();
    </script>

</body>
</html>
