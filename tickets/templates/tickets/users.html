<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMS - Manage Users</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold tracking-wider text-blue-500">TSMS</span>
            <span class="text-xs text-gray-400 font-mono pl-2 border-l border-gray-600">Admin Portal</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/api/dashboard-ui/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Dashboard</a>
            <a href="/api/categories-ui/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Categories</a>
            <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded transition font-medium cursor-pointer">Sign Out</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-white">User Management</h2>
            <p class="text-sm text-gray-400 mt-1">View users and manage their system roles.</p>
        </div>

        <div class="bg-gray-800 rounded-xl border border-gray-700 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-900 border-b border-gray-700 text-xs uppercase tracking-wider text-gray-400">
                            <th class="p-4 font-semibold">ID</th>
                            <th class="p-4 font-semibold">Username</th>
                            <th class="p-4 font-semibold">Email</th>
                            <th class="p-4 font-semibold">Date Joined</th>
                            <th class="p-4 font-semibold">Current Role</th>
                            <th class="p-4 font-semibold">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody" class="divide-y divide-gray-700/50">
                        <tr><td colspan="6" class="p-6 text-center text-gray-500">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('user_token');
        const role = localStorage.getItem('user_role');

        // Admin Guard
        if (!token || role !== 'ADMIN') {
            window.location.href = '/api/dashboard-ui/';
        }

        async function fetchUsers() {
            try {
                const response = await fetch('/api/users/', {
                    headers: { 'Authorization': 'Token ' + token }
                });

                if (response.ok) {
                    const users = await response.json();
                    renderUsers(users);
                }
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-500">No users found.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(user => {
                const isSuperUser = user.is_superuser ? 'disabled' : '';
                return `
                <tr class="hover:bg-gray-700/20 transition">
                    <td class="p-4 text-sm text-gray-400 font-mono">#${user.id}</td>
                    <td class="p-4 font-medium text-white">${user.username}</td>
                    <td class="p-4 text-sm text-gray-400">${user.email}</td>
                    <td class="p-4 text-sm text-gray-500">${new Date(user.date_joined || new Date()).toLocaleDateString()}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 text-[10px] uppercase tracking-wider rounded border font-bold 
                            ${user.role === 'ADMIN' ? 'bg-red-500/10 text-red-400 border-red-500/20' : 
                             (user.role === 'SUPPORT' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-gray-500/10 text-gray-400 border-gray-500/20')}">
                            ${user.role || 'USER'}
                        </span>
                    </td>
                    <td class="p-4">
                        <div class="flex items-center space-x-2">
                            <select id="roleSelect_${user.id}" class="bg-gray-900 border border-gray-700 rounded px-2 py-1.5 text-xs text-gray-300 focus:border-blue-500 outline-none" ${isSuperUser}>
                                <option value="USER" ${user.role === 'USER' ? 'selected' : ''}>User</option>
                                <option value="SUPPORT" ${user.role === 'SUPPORT' ? 'selected' : ''}>Support</option>
                                <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>Admin</option>
                            </select>
                            <button onclick="updateRole(${user.id})" class="text-blue-400 hover:text-blue-300 text-xs font-semibold px-2 py-1 border border-blue-500/30 rounded bg-blue-500/10 cursor-pointer transition" ${isSuperUser}>
                                Update
                            </button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        async function updateRole(userId) {
            const newRole = document.getElementById(`roleSelect_${userId}`).value;
            try {
                const response = await fetch(`/api/users/${userId}/role/`, { // تأكد من مسار التعديل
                    method: 'PATCH',
                    headers: { 
                        'Authorization': 'Token ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ role: newRole })
                });

                if (response.ok) {
                    alert('User role updated successfully!');
                    fetchUsers(); 
                } else {
                    const error = await response.json();
                    alert('Failed: ' + JSON.stringify(error));
                }
            } catch (error) {
                console.error('Error updating role:', error);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/api/login-ui/';
        }

        fetchUsers();
    </script>
</body>
</html>
