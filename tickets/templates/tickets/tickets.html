<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMS - Support Tickets</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl font-bold tracking-wider text-blue-500">TSMS</span>
            <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-1 rounded border border-blue-500/30 font-mono">v1.0</span>
        </div>
        <div class="flex items-center space-x-4">
            <a href="/api/dashboard/" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded transition font-medium">Dashboard</a>
            <button onclick="logout()" class="text-xs bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 px-3 py-1.5 rounded transition font-medium cursor-pointer">Sign Out</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 mb-8 shadow-sm">
            <h3 class="text-lg font-bold text-white mb-4">Create New Ticket</h3>
            <form id="createTicketForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Ticket Title</label>
                    <input type="text" id="ticketTitle" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Detailed Description</label>
                    <textarea id="ticketDesc" rows="3" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Category ID</label>
                    <input type="number" id="ticketCategory" required value="1" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500 transition font-mono max-w-[120px]">
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold px-5 py-2.5 rounded-lg transition shadow-md cursor-pointer text-sm">
                        Submit Ticket
                    </button>
                </div>
            </form>
        </div>

        <div class="mb-4">
            <h2 class="text-xl font-bold text-white">Your Current Tickets</h2>
            <p class="text-xs text-gray-400 mt-0.5">Track and manage the status of your reported issues.</p>
        </div>

        <div id="ticketsList" class="space-y-4">
            </div>
    </main>

    <script>
        // 1. Auth Guard
        const token = localStorage.getItem('user_token');
        if (!token) {
            window.location.href = '/api/login-ui/';
        }

        // 2. Fetch and Render Tickets Block
        async function fetchTickets() {
            try {
                const response = await fetch('http://127.0.0.1:8000/api/tickets/', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Token ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const tickets = await response.json();
                    const listContainer = document.getElementById('ticketsList');
                    listContainer.innerHTML = ''; 

                    if(tickets.length === 0) {
                        listContainer.innerHTML = `
                            <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 text-center text-gray-500 text-sm">
                                No active support tickets found.
                            </div>`;
                        return;
                    }

                    tickets.forEach(ticket => {
                        // Dynamic styling for status and priorities badges
                        let priorityClass = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                        if (ticket.priority === 'HIGH' || ticket.priority === 'URGENT') {
                            priorityClass = "bg-red-500/10 text-red-400 border-red-500/20";
                        } else if (ticket.priority === 'MEDIUM') {
                            priorityClass = "bg-yellow-500/10 text-yellow-400 border-yellow-500/20";
                        }

                        let statusClass = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                        if (ticket.status === 'IN_PROGRESS') statusClass = "bg-purple-500/10 text-purple-400 border-purple-500/20";
                        else if (ticket.status === 'WAITING_FOR_USER') statusClass = "bg-yellow-500/10 text-yellow-400 border-yellow-500/20";
                        else if (ticket.status === 'RESOLVED') statusClass = "bg-teal-500/10 text-teal-400 border-teal-500/20";
                        else if (ticket.status === 'CLOSED') statusClass = "bg-red-500/10 text-red-400 border-red-500/20";

                        const card = `
                            <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 relative hover:border-gray-600 transition shadow-sm border-r-4 border-r-blue-500">
                                <div class="flex justify-between items-start mb-2">
                                    <div class="text-lg font-bold text-white pr-24">${ticket.title}</div>
                                    <span class="px-2.5 py-0.5 text-xs rounded-full font-medium border font-mono ${statusClass}">
                                        ${ticket.status}
                                    </span>
                                </div>
                                <p class="text-sm text-gray-400 leading-relaxed">${ticket.description}</p>
                                <div class="mt-4 pt-3 border-t border-gray-700/50 flex flex-wrap gap-4 items-center justify-between text-xs text-gray-500 font-mono">
                                    <div>Created By: <span class="text-gray-300">User #${ticket.created_by}</span></div>
                                    <div class="flex items-center space-x-2">
                                        <span>Priority:</span>
                                        <span class="px-2 py-0.5 rounded border text-[11px] font-medium ${priorityClass}">${ticket.priority}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        listContainer.innerHTML += card;
                    });
                } else {
                    alert('Session expired or unauthorized. Please login again.');
                    logout();
                }
            } catch (error) {
                console.error('Error fetching tickets:', error);
            }
        }

        // 3. Handle Ticket Creation Form
        document.getElementById('createTicketForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('ticketTitle').value;
            const description = document.getElementById('ticketDesc').value;
            const category = document.getElementById('ticketCategory').value;

            try {
                const response = await fetch('http://127.0.0.1:8000/api/tickets/', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Token ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        category: parseInt(category)
                    })
                });

                if (response.ok) {
                    document.getElementById('createTicketForm').reset();
                    fetchTickets(); // Hot reload list seamlessly
                } else {
                    const errData = await response.json();
                    alert('Failed to submit ticket: ' + JSON.stringify(errData));
                }
            } catch (error) {
                console.error('Error creating ticket:', error);
            }
        });

        // 4. Logout Function
        function logout() {
            localStorage.removeItem('user_token');
            window.location.href = '/api/login-ui/';
        }

        // Initialize view
        fetchTickets();
    </script>
</body>
</html>
