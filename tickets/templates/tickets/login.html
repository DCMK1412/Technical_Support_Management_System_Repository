<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMS - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl">
        <div class="text-center mb-8">
            <div class="flex justify-center items-center space-x-2 mb-2">
                <span class="text-3xl font-extrabold tracking-wider text-blue-500">TSMS</span>
                <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30 font-mono">v1.0</span>
            </div>
            <p class="text-sm text-gray-400">Technical Support Management System</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" id="password" required placeholder="Enter your password" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 cursor-pointer">
                Sign In
            </button>
        </form>

        <div id="messageBox" class="mt-6 p-4 rounded-xl text-sm border font-medium hidden"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');

            messageBox.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-teal-500/10 text-teal-400 border-teal-500/20 block';
                    messageBox.innerText = 'Login successful! Redirecting...';

                    localStorage.setItem('user_token', data.token);

                    setTimeout(() => { 
                        window.location.href = '/api/tickets-ui/'; 
                    }, 1500);

                } else {
                    messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-red-500/10 text-red-400 border-red-500/20 block';
                    messageBox.innerText = data.error || 'Invalid username or password.';
                }

            } catch (error) {
                messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-red-500/10 text-red-400 border-red-500/20 block';
                messageBox.innerText = 'Server connection failed. Please ensure Django is running.';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
