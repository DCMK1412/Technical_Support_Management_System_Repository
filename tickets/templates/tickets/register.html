<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSMS - Create Account</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-gray-800 p-8 rounded-2xl border border-gray-700 shadow-xl">
        <div class="text-center mb-8">
            <div class="flex justify-center items-center space-x-2 mb-2">
                <span class="text-3xl font-extrabold tracking-wider text-blue-500">TSMS</span>
            </div>
            <p class="text-sm text-gray-400">Create a new support account</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
                <input type="text" id="username" required placeholder="Choose a username" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email</label>
                <input type="email" id="email" required placeholder="Enter your email" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
                <input type="password" id="password" required placeholder="Create a password" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" required placeholder="Repeat password" 
                    class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-gray-100 focus:outline-none focus:border-blue-500 transition font-mono">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 cursor-pointer mt-4">
                Register
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/api/login-ui/" class="text-sm text-blue-400 hover:text-blue-300 transition">Already have an account? Sign in</a>
        </div>

        <div id="messageBox" class="mt-6 p-4 rounded-xl text-sm border font-medium hidden"></div>
    </div>


<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const messageBox = document.getElementById('messageBox');

        messageBox.classList.add('hidden');

        if (password !== confirmPassword) {
            messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-red-500/10 text-red-400 border-red-500/20 block';
            messageBox.innerText = 'Passwords do not match!';
            return;
        }

        try {
            const response = await fetch('http://127.0.0.1:8000/api/auth/register/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: username,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-teal-500/10 text-teal-400 border-teal-500/20 block';
                messageBox.innerText = 'Account created successfully! Redirecting to login...';
                setTimeout(() => { window.location.href = '/api/login-ui/'; }, 1500);
            } else {
                messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-red-500/10 text-red-400 border-red-500/20 block';
                
                if (data && typeof data === 'object' && !data.error) {
                    let errorMessages = [];
                    for (const [field, messages] of Object.entries(data)) {
                        errorMessages.push(`${field}: ${messages.join(', ')}`);
                    }
                    messageBox.innerText = errorMessages.join('\n');
                } else {
                    messageBox.innerText = data.error || 'Registration failed.';
                }
            }
        } catch (error) {
            messageBox.className = 'mt-6 p-4 rounded-xl text-sm border font-medium bg-red-500/10 text-red-400 border-red-500/20 block';
            messageBox.innerText = 'Server connection failed.';
        }
    });
</script>
</body>
</html>
