<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Support Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Technical Support Management System</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="nav-links">
                    </ul>
                <button id="logout-btn" class="btn btn-outline-danger d-none" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
<script>

    if (!localStorage.getItem('user_token')) {
        window.location.href = '/login-ui/';
    }

    const token = localStorage.getItem('user_token');
    const role = localStorage.getItem('user_role');
    const navLinks = document.getElementById('nav-links');

    if (token) {
        document.getElementById('logout-btn').classList.remove('d-none');

        let links = `
            <li class="nav-item"><a class="nav-link" href="/dashboard-ui/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/tickets/">Tickets</a></li>
        `;

        if (role === 'ADMIN') {
            links += `
                <li class="nav-item"><a class="nav-link" href="/categories/">Categories</a></li>
                <li class="nav-item"><a class="nav-link" href="/users/">Users</a></li>
            `;
        }

        navLinks.innerHTML = links;
    } else {
        navLinks.innerHTML = `
            <li class="nav-item"><a class="nav-link" href="/login-ui/">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="/register-ui/">Register</a></li>
        `;
    }

        function logout() {
            fetch('/api/auth/logout/', {
                method: 'POST',
                headers: { 'Authorization': 'Token ' + localStorage.getItem('user_token') }
            })
            .finally(() => { 
                localStorage.clear();
                window.location.href = '/login-ui/';
            });
        }
    </script>
</body>
</html>
